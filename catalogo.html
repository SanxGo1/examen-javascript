<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoStock - Catálogo y Carrito</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="#" class="logo">TecnoStock</a>
            <button id="cart-toggle-btn" class="cart-btn">
                 Carrito <span id="cart-badge" class="badge" style="display: none;">0</span>
            </button>
        </nav>
    </header>

    <main>
        <section class="filters-section">
            <input type="text" id="search-input" placeholder="Buscar productos por nombre o descripción...">
            <select id="category-filter">
                <option value="">Todas las categorías</option>
            </select>
        </section>

        <section id="product-catalog">
        </section>
    </main>

    <!-- Sidebar del Carrito -->
    <aside id="cart-sidebar" class="cart-sidebar">
        <div class="cart-sidebar-header">
            <h3>Tu Carrito</h3>
            <button id="close-cart-btn" class="close-cart">&times;</button>
        </div>
        <div id="shopping-cart">
        </div>
    </aside>

    <script type="module" src="js/app.js"></script>
</body>
</html>
